# ============================================================
# EnvShield 配置文件
# 修改后执行 `envshield apply` 立即生效，或重启自动加载
# ============================================================

# ---------- 属性归一 ----------
# 1 = 开启基础属性归一（ro.secure / ro.build.selinux / ro.boot.selinux）
ES_PROP_STRICT=1

# 1 = 额外关闭调试能力（ro.debuggable=0, ro.adb.secure=1, ro.kernel.qemu=0）
#     注意：会关掉 adb root 调试，开发机请保持 0
ES_PROP_AGGRESSIVE=0

# 1 = 伪装引导器状态（verifiedbootstate=green / flash.locked=1 ...）
#     警告：真机解锁状态下开启，可能被 TEE/Keymaster 交叉校验反查。
#     不清楚原理请保持 0。
ES_PROP_SPOOF_BOOT=0

# 1 = 一致性归一：把 *.build.type / *.build.tags / fingerprint / description
#     统一改成 user / release-keys，避免「改了 tags 指纹里却还写着 test-keys」
#     这种自相矛盾的低级破绽。原厂 user 固件上不会有任何改动。
ES_PROP_CONSISTENT=1

# ---------- SELinux ----------
# 1 = 若为 Permissive 则切回 Enforcing
ES_SELINUX_ENFORCE=1

# ---------- 临时目录 ----------
# 1 = 开启 /data/local/tmp 守卫
ES_TMP_GUARD=1

# 1 = 隔离 tmp 下所有文件（更干净，但会打断 adb push 工作流）
# 0 = 只隔离 ELF 可执行文件与已知工具名（推荐）
ES_TMP_ALL=0

# 只处理「最后修改时间超过 N 秒」的文件，避免打断正在进行的 adb push
# 0 = 不检查（处理所有文件）
ES_TMP_MIN_AGE=30

# ---------- 看护 ----------
# 1 = 开机后低频巡检，属性被改回/新掉落二进制时自动修复
ES_WATCHDOG=1

# 巡检间隔（秒，10 - 600）；修改后无需重启，下一轮自动读取
ES_WATCH_INTERVAL=30

# ---------- 目标应用 ----------
# 需要隐藏 Root 的包名，空格分隔。
# Magisk 环境下会自动写入 DenyList（配合 Shamiko 使用）。
# KernelSU / APatch 环境下请到管理器里为这些应用开启「卸载模块」。
ES_TARGETS=""

# 额外的风险包名（自检时提示用），空格分隔，会叠加在内置清单上
ES_RISK_PKGS=""
